# Estudio de decisión (E13 / defensa F02): ¿cómo colocar todo el hormigón en el menor tiempo
# con P_f = P({M_T > 70 °C} ∪ {M_Δ > 20 °C}) <= 5 %?
#
#   mcplan estudio config/estudio.yaml                 # corre lo que falta y escribe tablas y figuras
#   mcplan estudio config/estudio.yaml --detalle 5V-e24 M1_SS fría   # una corrida con cortes y VTK
#
# La física (geometría IFC, suelo, bordes, moldaje) es la de caso_14d.yaml; aquí se fijan t0,
# recursos, curvas, clima y la familia de planes. Mismos escenarios y pesos para todos los planes.

caso: caso_14d.yaml
salida: ../resultados/estudio

t0: "2026-11-19T08:00"     # jueves 19 nov 2026, 08:00 hora local (America/Santiago, UTC-3), común a todos los planes
horizonte_h: 336           # 14 días desde t0
despues_ultima_colocacion_h: 168   # además, al menos 7 días después de la última colocación (picos tardíos)
despues_ultimo_retiro_h: 168       # y hasta 7 días después del último retiro de moldaje o aislación: el ΔT
                                  # que induce el retiro queda dentro de la evaluación (no se esconde)
dx: 0.275                  # malla de exploración [m]; la propuesta se confirma con una malla más fina
dt_max_s: 600
guardar_cada_h: 1.0
profundidad_superficie_m: 0.025

recursos:
  tasa_colocacion_m3_h: 27  # [SUPUESTO] una bomba y una cuadrilla: Ju y Lei vaciaron una fundación igual en
                            # ~24 h (637 m³ / 24 h ≈ 27 m³/h). Etapas en serie, sin simultaneidad.
T_colocacion: 18           # °C, igual en todas las etapas (guía del curso); los planes pueden cambiarla

curvas:
  archivo: ../data/hidratacion/source_terms.txt   # 8 curvas Q(t) [W/m³] del profesor, versión corregida del 14 nov 2026
  usar: todas
  pesos: iguales           # [HIPÓTESIS] 8 probetas de la misma mezcla (M1-M4 × 2 campañas), equiprobables
  desfase_h: 2.0           # t = 0 del archivo = inicio del registro + 2 h
  cola: exponencial        # después del registro (sensibilidad: cero / constante)

clima:
  fuente: ensemble         # 51 miembros ECMWF IFS ENS + continuación climatológica ERA5 (o: era5_bloques)
  ensemble: ultimo
  climatologia: ultimo
  historias: 3             # terciles del índice de frío; peso = fracción de miembros representada
  dias_indice: 7
  transicion_h: 24
  ventana_dias: 3

# Familia de planes (14 nov 2026, curvas corregidas). Con estas curvas Tmax cumple sin protección y el
# problema es el ΔT, así que la familia recorre niveles de protección de la vertida única (la más rápida
# posible con una bomba: D = V/r ≈ 23,6 h; todo plan sin esperas es físicamente igual) y, como variante más
# lenta, las 5 vertidas del IFC con esperas y la protección más completa. Recursos comunes: una bomba a 27 m³/h.
#
# Protecciones de cada plan:
#   M5 / M10: manta de 5 / 10 cm en todas las caras expuestas, más el moldaje, hasta después del horizonte de
#             evaluación (retiro a las 600 h). El retiro se planifica aparte: ver docs/decision.md.
#   T10:      colocación a 10 °C (hormigón preenfriado); sin esa marca, 18 °C.
#   A25:      un serpentín HDPE a media altura de cada vertida (filas cada 1 m, 20 L/min), agua a 25 °C, 14 días.
#             Con agua a 20 °C el ΔT empeora: enfría de más el hormigón junto a los bordes.
planes:
  - nombre: unica
    descripcion: vertida única sin protección (moldaje 72 h)
    etapas: [[1, 2, 3, 4, 5]]
  - nombre: unica-M10
    descripcion: vertida única con manta de 10 cm en todas las caras
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: &m10
      moldaje: {retiro_h: 600}
      aislacion: {capa: manta_10cm, caras: todas, retiro_h: 600}
  - nombre: unica-M10-T10
    descripcion: vertida única con manta de 10 cm y colocación a 10 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
  - nombre: unica-M10-A25
    descripcion: vertida única con manta de 10 cm y tubos con agua a 25 °C (colocación a 18 °C)
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: &a25
      - {nombre: tubos_V1, vertida: 1, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V2, vertida: 2, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
  - nombre: unica-M5-T10-A25
    descripcion: vertida única con manta de 5 cm, colocación a 10 °C y tubos con agua a 25 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 600}
      aislacion: {capa: manta_5cm, caras: todas, retiro_h: 600}
    tubos: *a25
  - nombre: unica-M10-T10-A25
    descripcion: vertida única con manta de 10 cm, colocación a 10 °C y tubos con agua a 25 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *a25
  - familia: 5V-M10-T10-A25
    descripcion: 5 vertidas del IFC con manta de 10 cm, colocación a 10 °C y tubos con agua a 25 °C
    T_colocacion: 10
    etapas: [[1], [2], [3], [4], [5]]
    esperas_h: [12, 24]
    cubiertas: *m10
    tubos: *a25
  # Más margen (agregados después de la confirmación con malla fina: unica-M10-T10-A25 llega a M_Δ = 19,8 °C con
  # dx = 0,275 m y a 20,6 °C con 0,11 m en su peor escenario). T8 = colocación a 8 °C; S75 = tubos cada 0,75 m.
  - nombre: unica-M10-T8-A25
    descripcion: vertida única con manta de 10 cm, colocación a 8 °C y tubos con agua a 25 °C
    T_colocacion: 8
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *a25
  - nombre: unica-M10-T10-A25-S75
    descripcion: vertida única con manta de 10 cm, colocación a 10 °C y tubos cada 0,75 m con agua a 25 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: &a25s75
      - {nombre: tubos_V1, vertida: 1, material: hdpe, serpentin: {separacion: 0.75}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V2, vertida: 2, material: hdpe, serpentin: {separacion: 0.75}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 0.75}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 0.75}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 0.75}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
  - nombre: unica-M10-T8-A25-S75
    descripcion: vertida única con manta de 10 cm, colocación a 8 °C y tubos cada 0,75 m con agua a 25 °C
    T_colocacion: 8
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *a25s75
  # Tubos sólo en el núcleo (V3, V4, V5): el punto frío está en el anillo exterior de la losa (V1+V2, 1,1 m de
  # espesor), y los serpentines de V1 y V2 pasan bajo ese anillo y lo enfrían. N = tubos sólo en el núcleo.
  - nombre: unica-M10-T10-N25
    descripcion: vertida única con manta de 10 cm, colocación a 10 °C y tubos sólo en V3-V5 con agua a 25 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: &n25
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
  - nombre: unica-M10-T10-N20
    descripcion: vertida única con manta de 10 cm, colocación a 10 °C y tubos sólo en V3-V5 con agua a 20 °C
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: &n20
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 20, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 20, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 20, durante_h: 336}
  - nombre: unica-M10-T8-N20
    descripcion: vertida única con manta de 10 cm, colocación a 8 °C y tubos sólo en V3-V5 con agua a 20 °C
    T_colocacion: 8
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *n20
  # Umbral de la temperatura de colocación (16 nov): la propuesta con hormigón más tibio, para fijar la T máxima
  # de colocación del Plan de Control de Temperatura (camiones sobre ese valor se rechazan o se enfrían), y más
  # frío (8 °C), que es a lo que apunta la planta para cumplir el máximo con holgura.
  - nombre: unica-M10-T8-N25
    descripcion: la propuesta con colocación a 8 °C
    T_colocacion: 8
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *n25
  - nombre: unica-M10-T12-N25
    descripcion: la propuesta con colocación a 12 °C
    T_colocacion: 12
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *n25
  - nombre: unica-M10-T14-N25
    descripcion: la propuesta con colocación a 14 °C
    T_colocacion: 14
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *n25
  - nombre: unica-M10-T16-N25
    descripcion: la propuesta con colocación a 16 °C
    T_colocacion: 16
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas: *m10
    tubos: *n25

  # Propuesta final (17 nov 2026), elegida de la exploración del retiro (config/retiro_tubos_era5.yaml y
  # retiro_tubos2_era5.yaml) con la regla fijada antes de la segunda ronda: P_f <= 5 % con la corrección de malla y
  # el mayor margen. Tubos del núcleo hasta el retiro: agua a 25 °C hasta el día 14, 20 °C hasta el 21 y 15 °C hasta
  # el retiro de moldaje y manta el día 28 (648 h después de terminar la colocación).
  - nombre: unica-M10-T10-N25-R28
    descripcion: vertida única, 10 °C, manta 10 cm, tubos V3-V5 hasta el retiro (25/20/15 °C), retiro el día 28
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 648}
      aislacion: {capa: manta_10cm, caras: todas, retiro_h: 648}
    tubos: &r28
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20,
         programa: [{hasta_h: 336, T_agua_C: 25}, {hasta_h: 504, T_agua_C: 20}, {hasta_h: 660, T_agua_C: 15}]}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20,
         programa: [{hasta_h: 336, T_agua_C: 25}, {hasta_h: 504, T_agua_C: 20}, {hasta_h: 660, T_agua_C: 15}]}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20,
         programa: [{hasta_h: 336, T_agua_C: 25}, {hasta_h: 504, T_agua_C: 20}, {hasta_h: 660, T_agua_C: 15}]}

# Familia anterior (curvas retiradas): vertida única, 5V con esperas de 12-72 h, 8C con 24-48 h, protecciones a
# 10 °C con manta de 5 cm, y tubos HDPE/cobre con agua a 10 °C. Queda en el historial de git (commit f15175f).
planes_anteriores:
  - nombre: unica
    descripcion: vertida única, colocación continua de todo el volumen
    etapas: [[1, 2, 3, 4, 5]]
  - familia: 5V
    descripcion: 5 vertidas del IFC
    etapas: [[1], [2], [3], [4], [5]]
    esperas_h: [12, 24, 48, 72]
  - familia: 8C
    descripcion: 8 capas de <= 0,55 m (V3, V4 y V5 en dos)
    etapas:
      - {vertidas: [1]}
      - {vertidas: [2]}
      - {vertidas: [3], z: [1.10, 1.65]}
      - {vertidas: [3], z: [1.65, 2.20]}
      - {vertidas: [4], z: [2.20, 2.75]}
      - {vertidas: [4], z: [2.75, 3.30]}
      - {vertidas: [5], z: [3.30, 3.80]}
      - {vertidas: [5], z: [3.80, 4.30]}
    esperas_h: [24, 48]
  # Con protecciones (para cuantificar qué habría que cambiar): colocación a 10 °C, manta de 5 cm en
  # todas las caras expuestas y moldaje durante los 14 días.
  - nombre: unica-P
    descripcion: vertida única a 10 °C con manta en todas las caras y moldaje 14 días
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 400}
      aislacion: {capa: manta_5cm, caras: todas, retiro_h: 400}
  - familia: 8C-P
    descripcion: 8 capas a 10 °C con manta en todas las caras y moldaje 14 días
    T_colocacion: 10
    etapas:
      - {vertidas: [1]}
      - {vertidas: [2]}
      - {vertidas: [3], z: [1.10, 1.65]}
      - {vertidas: [3], z: [1.65, 2.20]}
      - {vertidas: [4], z: [2.20, 2.75]}
      - {vertidas: [4], z: [2.75, 3.30]}
      - {vertidas: [5], z: [3.30, 3.80]}
      - {vertidas: [5], z: [3.80, 4.30]}
    esperas_h: [48]
    cubiertas:
      moldaje: {retiro_h: 400}
      aislacion: {capa: manta_5cm, caras: todas, retiro_h: 400}
  # Con tubos de enfriamiento: un serpentín a media altura de cada vertida (filas cada 1 m), agua a 10 °C
  # durante 14 días desde el inicio de cada vertida. "TG": además hormigón con grafito (k = 4 W/mK). Chen et al.
  # (2024) midieron 4,11 W/mK con árido recubierto de grafito, 1,9 veces el mismo hormigón sin grafito; aplicado a
  # nuestro k base da ≈ 4,2, así que 4,0 queda del lado conservador. Reparos en docs/tubos.md, sección 3.
  - nombre: unica-T
    descripcion: vertida única con tubos HDPE en las 5 vertidas, agua a 10 °C
    etapas: [[1, 2, 3, 4, 5]]
    tubos: &tubos_hdpe
      - {nombre: tubos_V1, vertida: 1, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V2, vertida: 2, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
  - nombre: unica-TG
    descripcion: vertida única con tubos de cobre y hormigón con grafito (k = 4) en las 5 vertidas
    etapas: [[1, 2, 3, 4, 5]]
    materiales: {1: {k: 4.0}, 2: {k: 4.0}, 3: {k: 4.0}, 4: {k: 4.0}, 5: {k: 4.0}}
    tubos:
      - {nombre: tubos_V1, vertida: 1, material: cobre, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V2, vertida: 2, material: cobre, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V3, vertida: 3, material: cobre, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: cobre, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: cobre, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 10, durante_h: 336}
