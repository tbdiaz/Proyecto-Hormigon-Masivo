# Estudio de decisión con clima REAL (16 nov 2026, decisión del grupo): la vertida se fija el miércoles 19 nov 2025
# a las 08:00, la misma fecha de la presentación pero un año antes, para que todo el horizonte tenga clima medido.
#
#   mcplan estudio config/estudio_2025.yaml        # 17 planes x 8 curvas x 3 historias = 408 corridas (~1 h)
#
# Clima: reanálisis ERA5 (Open-Meteo Historical Weather API) de 30 temporadas reales, 1996-2025, en las mismas
# fechas del calendario (19 nov - 6 ene). Cada año es una historia completa y real (sin promediar); se agrupan en
# terciles del índice de frío y cada tercil pesa 1/3. 2025 es el clima que efectivamente ocurrió.
# Suelo: estado real de ERA5 el 19 nov 2025 a las 08:00 (se puede medir antes de vaciar).
# La familia de planes, la física, las curvas y los recursos son los de config/estudio.yaml.

hereda: estudio.yaml
salida: ../resultados/estudio_2025
t0: "2025-11-19T08:00"     # miércoles 19 nov 2025, 08:00 hora local (America/Santiago, UTC-3)

clima:
  fuente: era5_bloques
  climatologia: ../data/clima/snapshots/era5_1119_1996-2025_20261116T2119Z.json
  historias: 3
  suelo_inicial: real
