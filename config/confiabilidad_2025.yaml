# Confiabilidad del plan propuesto con las 30 temporadas reales de ERA5 (1996-2025), sin reducirlas a terciles:
# cada año es una historia con peso 1/30. 8 curvas x 30 años = 240 corridas (~40 min).
#
#   mcplan estudio config/confiabilidad_2025.yaml
#
# La fila con clima ERA5_2025 es la verificación con el clima que efectivamente ocurrió.

hereda: estudio_2025.yaml
salida: ../resultados/confiabilidad_2025
clima:
  historias: 30
planes: [unica-M10-T10-N25]
