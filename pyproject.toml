[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcplan"
version = "0.1.0"
description = "Planificación de vertidas de hormigón masivo mediante simulación térmica (Grupo 4)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "ifcopenshell>=0.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mcplan = "mcplan.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: tests que tardan más de ~10 s (pytest -m \"not lento\" para la batería rápida)"]
