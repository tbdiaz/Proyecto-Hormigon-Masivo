# Prueba de estrés de la propuesta final: las 8 curvas con 20 % más de calor (24 escenarios).
#
#   mcplan estudio config/estres_era5.yaml
#
# El encabezado de data/hidratacion/source_terms.txt da la energía con β = 2,1 y 3,0 W/m²K: x0,84 y x1,20 respecto
# de β = 2,5. La escala 1,2 cubre el extremo superior de esa incertidumbre de la inversión de las probetas.
# Es una sensibilidad determinista, no un escenario con peso.

hereda: estudio_era5.yaml
salida: ../resultados/estres_era5
curvas:
  escala: 1.2
planes: [unica-M10-T10-N25-R28, r3-T8-A25-20-15-10-d32]
