# Retiro de las protecciones del plan propuesto: ¿cuándo se pueden sacar el moldaje y las mantas sin que el ΔT
# pase de 20 °C? Se simulan 30 días (720 h) para ver el choque térmico del retiro.
#
#   mcplan estudio config/retiro_2025.yaml         # 3 planes x 8 curvas x 3 historias = 72 corridas (~20 min)
#
# El retiro se cuenta desde el fin de la vertida (23,6 h): 312, 480 y 600 h después = días 14, 21 y 26 desde t0.
# Todo lo demás es la propuesta (manta de 10 cm en todas las caras, 10 °C, tubos en V3-V5 con agua a 25 °C).

hereda: estudio_2025.yaml
salida: ../resultados/retiro_2025
horizonte_h: 720

planes:
  - nombre: propuesta-retiro-d14
    descripcion: la propuesta, retirando moldaje y mantas el día 14 (312 h después de terminar la vertida)
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 312}
      aislacion: {capa: manta_10cm, caras: todas, retiro_h: 312}
    tubos: &n25
      - {nombre: tubos_V3, vertida: 3, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V4, vertida: 4, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
      - {nombre: tubos_V5, vertida: 5, material: hdpe, serpentin: {separacion: 1.0}, caudal_l_min: 20, T_agua_C: 25, durante_h: 336}
  - nombre: propuesta-retiro-d21
    descripcion: la propuesta, retirando moldaje y mantas el día 21 (480 h después de terminar la vertida)
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 480}
      aislacion: {capa: manta_10cm, caras: todas, retiro_h: 480}
    tubos: *n25
  - nombre: propuesta-retiro-d26
    descripcion: la propuesta, retirando moldaje y mantas el día 26 (600 h después de terminar la vertida)
    T_colocacion: 10
    etapas: [[1, 2, 3, 4, 5]]
    cubiertas:
      moldaje: {retiro_h: 600}
      aislacion: {capa: manta_10cm, caras: todas, retiro_h: 600}
    tubos: *n25
